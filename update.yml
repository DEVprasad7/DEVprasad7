name: Update profile

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST every day
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name  "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: daily profile refresh"
          git push
