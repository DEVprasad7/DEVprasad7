name: Refresh profile README

on:
  schedule:
    # 00:15 IST = 18:45 UTC on the previous calendar day
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh dynamic profile sections
        run: python scripts/generate_profile.py
      - name: Commit changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/header.svg assets/quote.svg
          git diff --cached --quiet || git commit -m "chore: refresh daily profile content"
          git push
