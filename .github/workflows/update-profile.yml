name: Refresh profile artwork

on:
  schedule:
    # 18:30 UTC = 00:00 IST
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily SVG assets
        run: python scripts/generate_profile.py
      - name: Commit refreshed artwork if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
          else
            git commit -m "chore: refresh daily profile assets"
            git push
          fi
