name: Contribution snake

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
      - name: Commit snake
        run: |
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git config user.name  "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets/snake.svg
          git diff --cached --quiet || git commit -m "chore: refresh snake"
          git push
